---
# Demo inventory. In AAP this is replaced by a Controller inventory;
# the playbooks only care that audit targets land in the `sox_targets` group.
all:
  children:
    sox_targets:
      hosts:
        # Replace with the RHEL hosts in scope for the SOX audit.
        rhel-demo-01:
        rhel-demo-02:

    # Convenience group so the demo can be driven against the control node
    # itself with: ansible-playbook playbooks/sox_service_audit.yml -l local_demo
    local_demo:
      hosts:
        localhost:
          ansible_connection: local
